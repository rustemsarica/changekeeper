[workspace]
resolver = "2"

members = [
    "crates/ck_cli",
    "crates/ck_workspace",
    "crates/ck_storage",
    "crates/ck_merge",
    "crates/ck_git",
    "crates/ck_config",
    "crates/ck_models", "crates/ck_context",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"

thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1", features = ["v7", "serde"] }

directories = "6"

walkdir = "2"

sha2 = "0.10"

clap = { version = "4.5", features = ["derive"] }

dialoguer = "0.11"

tempfile = "3"
