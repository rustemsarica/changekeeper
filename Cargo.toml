[workspace]
resolver = "2"

members = [
    "crates/ck_cli",
    "crates/ck_engine",
    "crates/ck_git"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"

toml = "0.8"

dirs = "6"

uuid = { version = "1", features = ["v7", "serde"] }

clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

directories = "6"

chrono = { version = "0.4", features = ["serde"] }

walkdir = "2"

sha2 = "0.10"

thiserror = "2"

similar = "2"
