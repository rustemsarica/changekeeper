[workspace]
resolver = "2"

members = [
    "crates/ck_cli",
    "crates/ck_engine",
    "crates/ck_git"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"

clap = { version = "4.5", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

directories = "6"

chrono = { version = "0.4", features = ["serde"] }

walkdir = "2"

sha2 = "0.10"

thiserror = "2"
